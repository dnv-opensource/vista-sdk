name: C++ Build & Test

on:
  push:
    branches: [ "main", "ci/**", "feat/**", "feature/**", "test/**", "fix/**" ]
    paths: ["cpp/**", ".github/workflows/cpp-build-and-test.yml"]
  pull_request:
    branches: [ "main" ]
    paths: ["cpp/**", ".github/workflows/cpp-build-and-test.yml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }}, ${{ matrix.toolchain }}, ${{ matrix.link }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            toolchain: gcc
            link: static
          - os: ubuntu-24.04
            toolchain: gcc
            link: shared
          - os: ubuntu-24.04
            toolchain: clang
            link: static
          - os: ubuntu-24.04
            toolchain: clang
            link: shared

          - os: ubuntu-24.04-arm
            toolchain: gcc
            link: static
          - os: ubuntu-24.04-arm
            toolchain: gcc
            link: shared
          - os: ubuntu-24.04-arm
            toolchain: clang
            link: static
          - os: ubuntu-24.04-arm
            toolchain: clang
            link: shared

          - os: windows-2022
            toolchain: mingw
            link: static
          - os: windows-2022
            toolchain: mingw
            link: shared
          - os: windows-2022
            toolchain: msvc
            link: static
          - os: windows-2022
            toolchain: msvc
            link: shared

          - os: ubuntu-24.04
            toolchain: gcc
            link: static
            build_type: Release
          - os: windows-2022
            toolchain: msvc
            link: static
            build_type: Release

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Linux deps
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Install GCC (Linux)
        if: runner.os == 'Linux' && matrix.toolchain == 'gcc'
        run: |
          sudo apt-get install -y g++

      - name: Install Clang (Linux)
        if: runner.os == 'Linux' && matrix.toolchain == 'clang'
        run: |
          sudo apt-get install -y clang

      # Windows toolchains
      - name: Setup MSYS2 (MinGW)
        if: runner.os == 'Windows' && matrix.toolchain == 'mingw'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      # Linux (GCC/Clang, x86_64 and ARM64)
      - name: Configure (Linux)
        if: runner.os == 'Linux'
        env:
          CC: ${{ matrix.toolchain }}
          CXX: ${{ matrix.toolchain == 'gcc' && 'g++' || 'clang++' }}
        run: |
          cmake -S cpp -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type || 'Debug' }} \
            -DBUILD_SHARED_LIBS=${{ matrix.link == 'shared' && 'ON' || 'OFF' }} \
            -DDNV_VISTA_SDK_BUILD_TESTS=ON \
            -DDNV_VISTA_SDK_BUILD_SAMPLES=ON \
            -DDNV_VISTA_SDK_BUILD_BENCHMARKS=OFF \
            -DDNV_VISTA_SDK_WARNINGS=OFF \
            -DDNV_VISTA_SDK_ENABLE_SIMD=OFF

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: cmake --build build --parallel

      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        run: ctest --test-dir build --output-on-failure

      # Windows MinGW
      - name: Configure (Windows MinGW)
        if: runner.os == 'Windows' && matrix.toolchain == 'mingw'
        shell: msys2 {0}
        run: |
          cmake -S cpp -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type || 'Debug' }} \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DBUILD_SHARED_LIBS=${{ matrix.link == 'shared' && 'ON' || 'OFF' }} \
            -DDNV_VISTA_SDK_BUILD_TESTS=ON \
            -DDNV_VISTA_SDK_BUILD_SAMPLES=ON \
            -DDNV_VISTA_SDK_BUILD_BENCHMARKS=OFF \
            -DDNV_VISTA_SDK_WARNINGS=OFF \
            -DDNV_VISTA_SDK_ENABLE_SIMD=OFF

      - name: Build (Windows MinGW)
        if: runner.os == 'Windows' && matrix.toolchain == 'mingw'
        shell: msys2 {0}
        run: cmake --build build --parallel

      - name: Run tests (Windows MinGW)
        if: runner.os == 'Windows' && matrix.toolchain == 'mingw'
        shell: msys2 {0}
        run: ctest --test-dir build --output-on-failure

      # Windows MSVC
      - name: Configure (Windows MSVC)
        if: runner.os == 'Windows' && matrix.toolchain == 'msvc'
        shell: pwsh
        run: >
          cmake -S cpp -B build
          -G "Visual Studio 17 2022" -A x64
          -DBUILD_SHARED_LIBS=${{ matrix.link == 'shared' && 'ON' || 'OFF' }}
          -DDNV_VISTA_SDK_BUILD_TESTS=ON
          -DDNV_VISTA_SDK_BUILD_SAMPLES=ON
          -DDNV_VISTA_SDK_BUILD_BENCHMARKS=OFF
          -DDNV_VISTA_SDK_WARNINGS=OFF
          -DDNV_VISTA_SDK_ENABLE_SIMD=OFF

      - name: Build (Windows MSVC)
        if: runner.os == 'Windows' && matrix.toolchain == 'msvc'
        run: cmake --build build --config ${{ matrix.build_type || 'Debug' }} --parallel

      - name: Run tests (Windows MSVC)
        if: runner.os == 'Windows' && matrix.toolchain == 'msvc'
        run: ctest --test-dir build --build-config ${{ matrix.build_type || 'Debug' }} --output-on-failure

  install-and-consume:
    name: Install and consume via find_package() (${{ matrix.os }}, ${{ matrix.link }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        link: [static, shared]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++

      - name: Generate consumer project sources
        shell: bash
        run: |
          mkdir -p consumer
          cat > consumer/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.25)
          project(dnv_vista_sdk_consumer_smoke_test LANGUAGES CXX)

          find_package(dnv-vista-sdk REQUIRED)

          add_executable(consumer main.cpp)
          target_link_libraries(consumer PRIVATE dnv::vista::sdk)
          EOF
          cat > consumer/main.cpp <<'EOF'
          #include <dnv/VistaSDK.h>

          #include <iostream>

          int main()
          {
              std::cout << "dnv-vista-sdk version: " << dnv::vista::sdk::version() << "\n";

              const auto& vis = dnv::vista::sdk::VIS::instance();
              std::cout << "Latest VIS version    : " << static_cast<int>(vis.latest()) << "\n";
              return 0;
          }
          EOF

      # Linux (GCC, Ninja)
      - name: Configure SDK (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -S cpp -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=install \
            -DBUILD_SHARED_LIBS=${{ matrix.link == 'shared' && 'ON' || 'OFF' }} \
            -DDNV_VISTA_SDK_BUILD_TESTS=OFF \
            -DDNV_VISTA_SDK_BUILD_SAMPLES=OFF \
            -DDNV_VISTA_SDK_BUILD_BENCHMARKS=OFF \
            -DDNV_VISTA_SDK_WARNINGS=OFF \
            -DDNV_VISTA_SDK_ENABLE_SIMD=OFF

      - name: Build SDK (Linux)
        if: runner.os == 'Linux'
        run: cmake --build build --parallel

      - name: Install SDK (Linux)
        if: runner.os == 'Linux'
        run: cmake --install build

      - name: Configure consumer against installed package (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -S consumer -B consumer/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/install"

      - name: Build consumer (Linux)
        if: runner.os == 'Linux'
        run: cmake --build consumer/build --parallel

      - name: Run consumer (Linux)
        if: runner.os == 'Linux'
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/install/lib
        run: ./consumer/build/consumer

      # Windows (MSVC, Visual Studio generator)
      - name: Configure SDK (Windows MSVC)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >
          cmake -S cpp -B build
          -G "Visual Studio 17 2022" -A x64
          -DCMAKE_INSTALL_PREFIX=install
          -DBUILD_SHARED_LIBS=${{ matrix.link == 'shared' && 'ON' || 'OFF' }}
          -DDNV_VISTA_SDK_BUILD_TESTS=OFF
          -DDNV_VISTA_SDK_BUILD_SAMPLES=OFF
          -DDNV_VISTA_SDK_BUILD_BENCHMARKS=OFF
          -DDNV_VISTA_SDK_WARNINGS=OFF
          -DDNV_VISTA_SDK_ENABLE_SIMD=OFF

      - name: Build SDK (Windows MSVC)
        if: runner.os == 'Windows'
        run: cmake --build build --config Release --parallel

      - name: Install SDK (Windows MSVC)
        if: runner.os == 'Windows'
        run: cmake --install build --config Release

      - name: Configure consumer against installed package (Windows MSVC)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >
          cmake -S consumer -B consumer/build
          -G "Visual Studio 17 2022" -A x64
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}/install"

      - name: Build consumer (Windows MSVC)
        if: runner.os == 'Windows'
        run: cmake --build consumer/build --config Release --parallel

      - name: Run consumer (Windows MSVC)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = "${{ github.workspace }}\install\bin;$env:PATH"
          & "consumer\build\Release\consumer.exe"
